<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPC-DynaSurv — 登录</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo">🏥 NPC-DynaSurv</div>
            <div class="subtitle">NPC Patient Dynamic Risk Surveillance System</div>
        </div>

        <div class="auth-tabs">
            <button id="tab-login" class="active" onclick="switchTab('login')">登录</button>
            <button id="tab-register" onclick="switchTab('register')">注册</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
            <div id="login-error" class="alert alert-error" style="display:none;"></div>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="login-username" placeholder="请输入用户名" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>密码</label>
                <div class="password-wrap">
                    <input type="password" id="login-password" placeholder="请输入密码" required autocomplete="current-password">
                    <button type="button" class="toggle-pw" onclick="togglePassword('login-password', this)">显示</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">登 录</button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
            <div id="register-error" class="alert alert-error" style="display:none;"></div>
            <div id="register-success" class="alert alert-success" style="display:none;"></div>
            <div class="form-group">
                <label>用户名 *</label>
                <input type="text" id="reg-username" placeholder="至少3个字符" required>
            </div>
            <div class="form-group">
                <label>邮箱 *</label>
                <input type="email" id="reg-email" placeholder="请输入有效邮箱" required>
            </div>
            <div class="form-group">
                <label>密码 *</label>
                <div class="password-wrap">
                    <input type="password" id="reg-password" placeholder="至少6个字符" required>
                    <button type="button" class="toggle-pw" onclick="togglePassword('reg-password', this)">显示</button>
                </div>
            </div>
            <div class="form-group">
                <label>真实姓名 *</label>
                <input type="text" id="reg-fullname" placeholder="请输入真实姓名" required>
            </div>
            <div class="form-group">
                <label>科室</label>
                <input type="text" id="reg-department" placeholder="如：肿瘤科">
            </div>
            <div class="form-group">
                <label>医院</label>
                <input type="text" id="reg-hospital" placeholder="请输入所在医院">
            </div>
            <button type="submit" class="btn btn-primary">注 册</button>
        </form>
    </div>
</div>

<script src="/js/auth.js"></script>
</body>
</html>
